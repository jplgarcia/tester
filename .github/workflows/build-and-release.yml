name: build-and-release

# Builds the machine snapshot with scripts/build-snapshot.sh (pinned toolchain,
# see scripts/build.env) on every PR and tag. On a version tag (v*) it publishes
# a GitHub release with the snapshot, its sha256, the template hash and the
# toolchain versions.

on:
  push:
    tags:
      - "v*"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build snapshot
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU (riscv64)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: riscv64

      # Same BuildKit version as the reference local builds (Docker 27.5 / BuildKit v0.18.2)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: image=moby/buildkit:v0.18.2

      - name: Cache kernel and rootfs-tools
        uses: actions/cache@v4
        with:
          path: .build/images
          key: machine-images-${{ hashFiles('scripts/dependencies.sha256') }}

      - name: Build snapshot (cold, no BuildKit cache)
        env:
          NO_CACHE: "1"
        run: scripts/build-snapshot.sh

      - name: Summary
        run: |
          {
            echo '### Tester snapshot'
            echo
            echo '```'
            cat .build/build-info.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload snapshot artifacts
        uses: actions/upload-artifact@v4
        with:
          name: snapshot
          if-no-files-found: error
          path: |
            .build/snapshot.tar.gz
            .build/snapshot.tar.gz.sha256
            .build/template-hash.txt
            .build/build-info.txt

  release:
    name: release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download snapshot artifacts
        uses: actions/download-artifact@v4
        with:
          name: snapshot
          path: release-assets

      - name: Release notes
        run: |
          {
            echo "Template hash: \`$(cat release-assets/template-hash.txt)\`"
            echo
            echo "Deploy with \`cartesi-rollups-cli deploy application <name> <dir>\` after"
            echo "\`mkdir <dir> && tar -xzf snapshot.tar.gz -C <dir>\`."
            echo
            echo "Toolchain and checksums (build-info.txt):"
            echo
            echo '```'
            cat release-assets/build-info.txt
            echo '```'
          } > release-notes.md

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          prerelease: ${{ contains(github.ref, '-') }}
          fail_on_unmatched_files: true
          files: |
            release-assets/snapshot.tar.gz
            release-assets/snapshot.tar.gz.sha256
            release-assets/template-hash.txt
            release-assets/build-info.txt
